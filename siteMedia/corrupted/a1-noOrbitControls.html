<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angel • Nicer.app</title>
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
  <style>
    body { margin:0; overflow:hidden; background:#000; }
    canvas { display:block; }
    #loading {
      position: fixed; inset:0; background:#111;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-family:system-ui; font-size:1.5rem;
      transition: opacity 1.5s ease-out;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="loading">Loading angel…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.168",
    "three/addons/": "https://esm.sh/three@0.168/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';

import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/postprocessing/UnrealBloomPass.js';

const loadingScreen = document.getElementById('loading');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.FogExp2(0x0a0a1a, 0.0008);

// Lighting — soft and angelic
const ambient = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 3);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

const hemiLight = new THREE.HemisphereLight(0xe8c37b, 0x6b6bb3, 0.8);
scene.add(hemiLight);

// Camera
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4, 1.8, 4);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Post-processing — that heavenly glow
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.2,    // strength
  0.4,    // radius
  0.85    // threshold
);
composer.addPass(bloomPass);

// Controls — smooth auto-orbit + optional user control
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.rotateSpeed = 0.7;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;        // slow and majestic
controls.enablePan = false;
controls.enableZoom = false;
controls.minPolarAngle = Math.PI / 4;  // don't go too high
controls.maxPolarAngle = Math.PI / 2.2; // stay slightly above
controls.target.set(0, 1.1, 0);        // chest height of the angel

// Load the model (replace with your actual model path if different)
const loader = new GLTFLoader();
let modelLoaded = false;

loader.load(
  'angel.glb', // ← put your exact filename here (or keep the original path you used)
  (gltf) => {
    const model = gltf.scene;
    model.position.set(0, 0, 0);
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        // Make sure materials look good with bloom
        if (child.material) {
          child.material.envMapIntensity = 1.5;
        }
      }
    });
    scene.add(model);
    modelLoaded = true;

    // Fade out loading screen with style
    setTimeout(() => {
      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.remove(), 1600);
    }, 600);
  },
  (progress) => console.log((progress.loaded / progress.total * 100) + '% loaded'),
  (error) => console.error('Load error:', error)
);

// Handle resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  controls.update(); // required for damping + autoRotate

  // Only render composer after model is loaded (smoother first frame)
  if (modelLoaded) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
animate();
</script>

</body>
</html>
